<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calle el Hambre — Casting de Clientes</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1512; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; }
  canvas { display: block; }
  #hud { position: fixed; top: 0; left: 0; right: 0; padding: 14px 18px; display: flex; align-items: center; gap: 14px; z-index: 5; flex-wrap: wrap; }
  #hud h1 { margin: 0; font-size: 17px; color: #f5e9d0; font-weight: 700; letter-spacing: .3px; }
  #hud .sub { color: #a89880; font-size: 12px; }
  #moods { display: flex; gap: 8px; margin-left: auto; }
  #moods button {
    border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: #f5e9d0;
    padding: 7px 13px; border-radius: 20px; font-size: 13px; cursor: pointer; backdrop-filter: blur(4px);
  }
  #moods button:hover { background: rgba(255,255,255,.14); }
  .chip {
    position: fixed; transform: translate(-50%, 0); text-align: center; z-index: 4; pointer-events: none;
    color: #fff;
  }
  .chip .name { font-size: 14px; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,.8); letter-spacing: .3px; }
  .chip .role { font-size: 10.5px; color: #d8c9a8; text-shadow: 0 1px 6px rgba(0,0,0,.8); margin-top: 1px; }
</style>
</head>
<body>
<div id="hud">
  <h1>🍔 Calle el Hambre — Casting</h1>
  <span class="sub">prototipo de clientes · drag para orbitar</span>
  <div id="moods">
    <button data-mood="neutral">😐 Neutral</button>
    <button data-mood="happy">😄 Felices</button>
    <button data-mood="impatient">😒 Impacientes</button>
    <button data-mood="angry">😠 Enojados</button>
  </div>
</div>
<script type="module">
import * as THREE from './assets/vendor/three.module.js';
import { createCustomer } from './character-engine.js';

const ROSTER = [
  { name: 'Doña Rosa', role: 'la abuela del barrio',     skin: 0x9a6a48, hair: 'bun',      hairColor: '#b8b0a4', eyes: 'happy',  shirt: '#7a5f9e', gear: ['apron'],          mood: 'happy',    build: { sx: 1.15, sy: 0.78, belly: 0.8, headScale: 1.05 } },
  { name: 'Milo',      role: 'el nene, primer pancho',   skin: 0xf2b98d, hair: 'spiky',    hairColor: '#c9651e', eyes: 'round',  shirt: '#4a9ad8', gear: ['backpack'],       mood: 'happy',    build: { sx: 0.72, sy: 0.72, headScale: 1.3 } },
  { name: 'Beto',      role: 'oficinista sin tiempo',    skin: 0xeec39a, hair: 'flat',     hairColor: '#2e2019', eyes: 'round',  accessory: 'mustache', shirt: '#6d6d78', shirtStyle: 'suit', mood: 'impatient', pose: 'hips', build: { sx: 0.82, sy: 1.18, legLen: 1.2, headScale: 0.9 } },
  { name: 'Rocco',     role: 'el fisiculturista',        skin: 0xd18b64, hair: 'bald',     hairColor: '#2a2019', eyes: 'round',  accessory: 'mustache', shirt: '#c94f3a',      mood: 'neutral',  build: { sx: 1.3, sy: 0.95, shoulderW: 1.4, armR: 1.7, headScale: 0.88 } },
  { name: 'Lola',      role: 'modelo, come poco',        skin: 0xf6cba0, hair: 'ponytail', hairColor: '#d8b06a', eyes: 'round',  shirt: '#e8729c',                          mood: 'neutral',  build: { sx: 0.82, sy: 1.08, legLen: 1.15, shoulderW: 0.85 } },
  { name: 'Gordo',     role: 'pide doble siempre',       skin: 0xe8b48f, hair: 'cap',      hairColor: '#3a6ea8', eyes: 'happy',  accessory: 'freckles', shirt: '#f4d35e',     mood: 'happy',    build: { sx: 1.3, sy: 0.92, belly: 1.15, headScale: 1.0 } },
  { name: 'Kuki',      role: 'el skater, auriculares',   skin: 0xc99b78, hair: 'flat',     hairColor: '#2a2019', eyes: 'sleepy', shirt: '#3a3f4a', shirtStyle: 'hoodie', gear: ['headphones'], mood: 'neutral', build: { sx: 0.85, sy: 0.98 } },
  { name: 'Vicky',     role: 'la punki del barrio',      skin: 0xe8b48f, hair: 'mohawk',   hairColor: '#d83a5e', eyes: 'round',  shirt: '#3a3f4a', shirtStyle: 'hoodie',     mood: 'impatient', pose: 'hips', build: { sx: 0.9, sy: 1.0 } },
  { name: 'Abuelo Omar', role: 'camina lento, paga justo', skin: 0xc99b78, hair: 'bald',   hairColor: '#8a8078', eyes: 'sleepy', accessory: 'mustache', shirt: '#8fa3b8', gear: ['cane'],      mood: 'neutral',  build: { sx: 0.95, sy: 0.85, hunch: 0.38, headScale: 0.95 } },
  { name: 'Sol',       role: 'baila esperando',          skin: 0x7a4a2e, hair: 'afro',     hairColor: '#241a12', eyes: 'happy',  shirt: '#f0922e',                          mood: 'happy',    build: { sx: 0.95, sy: 1.0 } },
];

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2b2333);
scene.fog = new THREE.Fog(0x2b2333, 14, 26);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 60);
camera.position.set(0, 4.4, 12.4);
camera.lookAt(0, 0.75, -0.4);

scene.add(new THREE.HemisphereLight(0xfff4e0, 0x50465c, 1.15));
const key = new THREE.DirectionalLight(0xffe8c0, 2.1);
key.position.set(-3, 6, 5);
scene.add(key);
const rimPink = new THREE.DirectionalLight(0xff8fb0, 0.9);
rimPink.position.set(5, 3, -4);
scene.add(rimPink);
const rimCyan = new THREE.DirectionalLight(0x7fd4ff, 0.8);
rimCyan.position.set(-5, 3.5, -4);
scene.add(rimCyan);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6; key.shadow.camera.right = 6;
key.shadow.camera.top = 6; key.shadow.camera.bottom = -6;
document.body.appendChild(renderer.domElement);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 30), new THREE.MeshStandardMaterial({ color: 0x342b3d, roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const discMat = new THREE.MeshStandardMaterial({ color: 0x453b52, roughness: 0.75 });
const discEdge = new THREE.MeshStandardMaterial({ color: 0xffc35a, roughness: 0.4, emissive: 0x533b10 });
const customers = [];
const chips = [];

ROSTER.forEach((cfg, i) => {
  const col = i % 5, row = Math.floor(i / 5);
  const c = createCustomer(cfg);
  const disc = new THREE.Group();
  const d = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.75, 0.08, 32), discMat);
  d.position.y = -0.04; d.receiveShadow = true;
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.75, 0.025, 8, 40), discEdge);
  ring.rotation.x = Math.PI / 2; ring.position.y = 0.005;
  disc.add(d, ring);
  disc.position.set((col - 2) * 2.15, 0, row === 0 ? -1.7 : 0.9);
  scene.add(disc);
  c.group.position.set(0, 0, 0);
  c.group.scale.setScalar(1.3);
  disc.add(c.group);
  c._disc = disc;
  c._spin = 0;
  customers.push(c);

  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.innerHTML = `<div class="name">${cfg.name}</div><div class="role">${cfg.role}</div>`;
  document.body.appendChild(chip);
  chips.push(chip);
});

// mood buttons → setMood on everyone + matching indicator
const MOOD_IND = { neutral: null, happy: 'happy', impatient: 'sweat', angry: 'angry' };
document.getElementById('moods').addEventListener('click', (e) => {
  const m = e.target.dataset?.mood;
  if (!m) return;
  customers.forEach(c => { c.setMood(m); c.setIndicator(MOOD_IND[m]); c.talk(); });
});

// simple drag-orbit
let drag = null, camYaw = 0, camPitch = 0;
addEventListener('pointerdown', e => drag = { x: e.clientX, y: e.clientY, yaw: camYaw, pitch: camPitch });
addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', e => {
  if (!drag) return;
  camYaw = drag.yaw - (e.clientX - drag.x) * 0.005;
  camPitch = Math.max(-0.2, Math.min(0.5, drag.pitch - (e.clientY - drag.y) * 0.003));
});

const v = new THREE.Vector3();
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t = now / 1000;

  const R = 12.4;
  camera.position.set(Math.sin(camYaw) * R, 4.4 + camPitch * 5, Math.cos(camYaw) * R);
  camera.lookAt(0, 0.75, -0.4);

  customers.forEach((c, i) => {
    c.update(dt, t, null);
    c.group.rotation.y = c._spin + t * 0.22;      // slow turntable
    // label follows the character's head top
    c._disc.getWorldPosition(v); v.y += 1.95 * (c.bodyPivot.scale.y || 1);
    v.project(camera);
    const sx = Math.min(Math.max((v.x * 0.5 + 0.5) * innerWidth, 70), innerWidth - 70);
    const sy = (-v.y * 0.5 + 0.5) * innerHeight;
    chips[i].style.left = sx + 'px';
    chips[i].style.top = sy + 'px';
    chips[i].style.display = v.z < 1 ? 'block' : 'none';
  });
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
