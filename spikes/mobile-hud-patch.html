     tooltip/banners/toasts repositioned inside the band. -->
<style>

  .fr-top-bar { padding-top: calc(68px + env(safe-area-inset-top, 0px)) !important;
                padding-left: 48px !important; padding-right: 56px !important;
                align-items: flex-start !important; }
